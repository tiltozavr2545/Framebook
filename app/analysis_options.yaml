# Настройки анализатора. Перенесены из Amicus вместе с причинами — там
# каждое правило ниже уже однажды поймало настоящий баг.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Ключ `analyzer` в этом файле обязан быть ОДИН: YAML на дубль ключа молча
  # оставляет последний, и при слиянии двух веток пропадает либо exclude,
  # либо strict-режимы (поймано в Amicus).
  exclude:
    - build/**
    - android/**
    - ios/**
    # Генерат drift и json_serializable.
    - "**/*.g.dart"

  # Весь внешний мир здесь приходит как `Map<String, dynamic>` — ответы TMDB,
  # ПоискКино, OMDb и файл синхронизации. Без strict-casts `json['vote_average']`
  # молча сходит за `double` и падает в рантайме на первом `int`, а OMDb ещё
  # и присылает числа строками (`"8.7"`, `"N/A"`). Разбор — только явный.
  language:
    strict-casts: true
    strict-raw-types: true

  errors:
    # Забытый `await` уходит в `FlutterError.onError` необработанным — в
    # Amicus так «тихо не работала» запись пуш-токена; здесь так же тихо
    # не работала бы запись синхронизации.
    unawaited_futures: error
    use_build_context_synchronously: error

linter:
  # Только то, что ловит ошибки: форматирование отдано `dart format`.
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - use_build_context_synchronously
