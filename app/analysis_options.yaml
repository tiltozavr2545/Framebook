# Analyzer settings. Carried over from Amicus along with the reasons — there
# every rule below has already caught a real bug once.
include: package:flutter_lints/flutter.yaml

analyzer:
  # There must be ONE `analyzer` key in this file: on a duplicate key YAML
  # silently keeps the last one, and merging two branches loses either the
  # exclude list or the strict modes (caught in Amicus).
  exclude:
    - build/**
    - android/**
    - ios/**
    # Do NOT exclude `*.g.dart` (drift, json_serializable): they are part
    # files of libraries, and the exclusion hid not style but a compile
    # error — the generated code referred to a type whose import was removed
    # from database.dart, and `flutter analyze` said "No issues found".

  # The whole outside world arrives here as `Map<String, dynamic>` — TMDB,
  # PoiskKino and OMDb responses and the sync file. Without strict-casts
  # `json['vote_average']` silently passes for a `double` and fails at runtime
  # on the first `int`, and OMDb even sends numbers as strings (`"8.7"`,
  # `"N/A"`). Parsing is explicit only.
  language:
    strict-casts: true
    strict-raw-types: true

  errors:
    # A forgotten `await` goes to `FlutterError.onError` unhandled — in Amicus
    # that is how saving the push token "quietly didn't work"; here saving
    # the sync would quietly not work the same way.
    unawaited_futures: error
    use_build_context_synchronously: error

linter:
  # Only what catches bugs: formatting is left to `dart format`.
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - use_build_context_synchronously
