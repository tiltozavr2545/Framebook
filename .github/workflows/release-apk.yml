name: Release APK

# Pushing a vX.Y.Z tag → a signed universal APK → a GitHub Release with it.
# This is the distribution channel to friends (docs/operations.md).
#
# The signing key lives only in the repository secrets (ANDROID_KEYSTORE_BASE64
# and the passwords) and in a backup copy on the development machine — so a
# release doesn't depend on anyone's laptop. GitHub secrets can't be read
# back: if both the repository and the copy were lost, updating over the
# installed APK would become impossible.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Check that the tag matches pubspec version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(awk '/^version:[[:space:]]/ { print $2; exit }' pubspec.yaml)
          name=${version%+*}
          if [ "$TAG" != "v$name" ]; then
            echo "::error title=Tag mismatch::tag $TAG, but pubspec.yaml has $version (expected tag v$name)"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      # Database tests open an in-memory SQLite through the system library
      # (drift NativeDatabase); macOS has it, the runner needs it installed.
      - name: Install SQLite for database tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - run: flutter test

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "secret_value=\${$secret_name-}"
            if [ -z "$secret_value" ]; then
              echo "::error title=Missing signing secret::$secret_name is not configured"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/framebook-release.jks
          cat > android/key.properties <<EOF
          storeFile=framebook-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # No -PallowDebugSigning: if signing isn't set up, the build fails
      # instead of producing an APK signed with the debug key
      # (android/app/build.gradle.kts).
      - name: Build signed universal APK
        run: flutter build apk --release

      # A broken signature or a wrong key fails here, not on a friend's phone.
      # The certificate is public (it is in every release's notes); comparing
      # with it keeps an APK signed with another key from being published.
      - name: Verify the APK signature and certificate
        env:
          EXPECTED_SHA1: f4077f14a136ff0170f1cbc64a1af420514c0afd
        run: |
          set -eu
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          # The line prefix depends on the build-tools version ("Signer #1
          # certificate …" in 35, "V2 Signer: certificate …" in 37), so only
          # the part after it is matched. Exactly one certificate is allowed.
          echo "$certs" | grep -E 'certificate (DN|SHA-1 digest): ' || true
          sha1=$(echo "$certs" | sed -n 's/.*certificate SHA-1 digest: //p' | sort -u)
          if [ "$sha1" != "$EXPECTED_SHA1" ]; then
            echo "::error title=Wrong signing key::certificate SHA-1 $sha1, expected $EXPECTED_SHA1"
            exit 1
          fi

      - name: Create GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          out="build/app/outputs/flutter-apk/framebook-$NAME.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$out"
          gh release create "$TAG" "$out" --title "Framebook $NAME" --generate-notes

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/framebook-release.jks
